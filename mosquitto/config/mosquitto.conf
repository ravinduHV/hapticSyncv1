# Mosquitto Configuration for HapticSync
# Allow connections from any IP (RPi 5 on local network)
listener 1883 0.0.0.0
allow_anonymous true

# WebSockets support (optional, for browser-based MQTT clients)
listener 9001 0.0.0.0
protocol websockets

# Persistence & logging
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

